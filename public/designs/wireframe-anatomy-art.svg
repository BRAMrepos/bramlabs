<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <!-- WIREFRAME ANATOMY / BLUEPRINT -->
  <!-- Outer Technical Frame with Corner Targets -->
  <rect x="60" y="60" width="680" height="680" stroke="#00E5FF" stroke-width="6" fill="#111315"/>
  <circle cx="60" cy="60" r="16" fill="#00E5FF"/>
  <circle cx="740" cy="60" r="16" fill="#00E5FF"/>
  <circle cx="60" cy="740" r="16" fill="#00E5FF"/>
  <circle cx="740" cy="740" r="16" fill="#00E5FF"/>

  <!-- Top Title Bar -->
  <rect x="60" y="60" width="680" height="80" fill="#00E5FF"/>
