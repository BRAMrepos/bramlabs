<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <rect width="800" height="800" fill="#F4F1E9"/>
  <!-- device frame -->
  <rect x="220" y="80" width="360" height="640" rx="28" stroke="#111315" stroke-width="2.5"/>
  <rect x="240" y="120" width="320" height="560" rx="4" stroke="#111315" stroke-width="1.5"/>
  <!-- status bar -->
  <rect x="240" y="120" width="320" height="28" fill="#111315" opacity="0.06"/>
  <circle cx="400" cy="100" r="6" fill="#111315" opacity="0.3"/>
  <!-- nav -->
  <rect x="256" y="160" width="80" height="12" rx="2" fill="#111315" opacity="0.2"/>
  <rect x="456" y="158" width="88" height="16" rx="8" stroke="#23C5EF" stroke-width="1.5"/>
  <!-- hero module -->
  <rect x="256" y="196" width="288" height="120" rx="4" stroke="#111315" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="262" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#666963" letter-spacing="2">HERO / 16:9</text>
  <!-- content modules -->
  <rect x="256" y="336" width="136" height="100" rx="4" stroke="#111315" stroke-width="1.5"/>
  <rect x="408" y="336" width="136" height="100" rx="4" stroke="#111315" stroke-width="1.5"/>
  <rect x="256" y="452" width="288" height="48" rx="4" stroke="#111315" stroke-width="1.5"/>
  <rect x="256" y="516" width="288" height="48" rx="4" stroke="#111315" stroke-width="1.5"/>
  <rect x="256" y="580" width="180" height="36" rx="4" fill="#23C5EF" opacity="0.35" stroke="#111315" stroke-width="1"/>
  <!-- dimension callouts -->
  <line x1="180" y1="120" x2="180" y2="680" stroke="#23C5EF" stroke-width="1"/>
  <line x1="170" y1="120" x2="190" y2="120" stroke="#23C5EF" stroke-width="1"/>
  <line x1="170" y1="680" x2="190" y2="680" stroke="#23C5EF" stroke-width="1"/>
  <text x="160" y="400" text-anchor="middle" transform="rotate(-90 160 400)" font-family="ui-monospace,monospace" font-size="11" fill="#23C5EF" letter-spacing="2">640 PT</text>
  <line x1="240" y1="740" x2="560" y2="740" stroke="#23C5EF" stroke-width="1"/>
  <text x="400" y="765" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#23C5EF" letter-spacing="2">360 PT · SAFE AREA</text>
  <text x="400" y="50" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#111315" letter-spacing="4">WIREFRAME ANATOMY</text>
</svg>
