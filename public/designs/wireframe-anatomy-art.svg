  <!-- Large Blueprint Schematic Layout -->
  <!-- Header Wireframe Box -->
  <rect x="110" y="180" width="580" height="70" rx="8" stroke="#F4F1E9" stroke-width="4" stroke-dasharray="12 6"/>
  <text x="130" y="222" font-family="ui-monospace, monospace" font-weight="800" font-size="20" fill="#00E5FF">[ NAV_HEADER // 100% W ]</text>

