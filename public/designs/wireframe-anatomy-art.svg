  <rect x="110" y="270" width="580" height="180" rx="8" stroke="#F4F1E9" stroke-width="6" fill="#00E5FF" fill-opacity="0.15"/>
  <line x1="110" y1="270" x2="690" y2="450" stroke="#F4F1E9" stroke-width="2" opacity="0.4"/>
  <line x1="690" y1="270" x2="110" y2="450" stroke="#F4F1E9" stroke-width="2" opacity="0.4"/>
  <text x="400" y="370" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#F4F1E9" letter-spacing="4">HERO COMPONENT</text>

  <!-- 3 Grid Column Wireframes -->
  <rect x="110" y="470" width="170" height="150" rx="8" stroke="#F4F1E9" stroke-width="4"/>
  <text x="195" y="555" text-anchor="middle" font-family="ui-monospace, monospace" font-weight="800" font-size="16" fill="#FF5500">COL_01</text>

  <rect x="315" y="470" width="170" height="150" rx="8" stroke="#F4F1E9" stroke-width="4"/>
  <text x="400" y="555" text-anchor="middle" font-family="ui-monospace, monospace" font-weight="800" font-size="16" fill="#FF5500">COL_02</text>

  <rect x="520" y="470" width="170" height="150" rx="8" stroke="#F4F1E9" stroke-width="4"/>
  <text x="605" y="555" text-anchor="middle" font-family="ui-monospace, monospace" font-weight="800" font-size="16" fill="#FF5500">COL_03</text>

  <!-- Technical Dimension Callouts -->
  <line x1="90" y1="180" x2="90" y2="620" stroke="#FF5500" stroke-width="3"/>
  <polygon points="90,170 82,185 98,185" fill="#FF5500"/>
  <polygon points="90,630 82,615 98,615" fill="#FF5500"/>

  <line x1="110" y1="645" x2="690" y2="645" stroke="#FF5500" stroke-width="3"/>
  <polygon points="100,645 115,637 115,653" fill="#FF5500"/>
  <polygon points="700,645 685,637 685,653" fill="#FF5500"/>

