<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <!-- BOLD HIGH-CONTRAST ROTATION DIAL -->
  <!-- Outer thick tick marks ring -->
  <circle cx="400" cy="400" r="320" stroke="#F4F1E9" stroke-width="4" stroke-dasharray="8 16" opacity="0.6"/>
  <circle cx="400" cy="400" r="290" stroke="#F4F1E9" stroke-width="2" opacity="0.3"/>
  
  <!-- 3 Bold Shift Arcs: Day (White), Swing (Cyan), Night (Orange) -->
  <!-- Day shift: 07:00 to 15:00 (top right to bottom right) -->
  <path d="M 400 160 A 240 240 0 0 1 607 520" stroke="#F4F1E9" stroke-width="28" stroke-linecap="round"/>
  <!-- Swing shift: 15:00 to 23:00 (bottom right to bottom left) -->
  <path d="M 570 558 A 240 240 0 0 1 193 520" stroke="#00E5FF" stroke-width="28" stroke-linecap="round"/>
  <!-- Night shift: 23:00 to 07:00 (bottom left to top right) -->
  <path d="M 170 480 A 240 240 0 0 1 360 163" stroke="#FF5500" stroke-width="28" stroke-linecap="round"/>
  
  <!-- Inner dial track -->
  <circle cx="400" cy="400" r="190" stroke="#F4F1E9" stroke-width="6" opacity="0.8"/>
  
  <!-- Center dial pointer -->
  <line x1="400" y1="400" x2="540" y2="260" stroke="#FF5500" stroke-width="10" stroke-linecap="round"/>
  <circle cx="400" cy="400" r="24" fill="#FF5500"/>
  <circle cx="400" cy="400" r="10" fill="#F4F1E9"/>
  <circle cx="540" cy="260" r="12" fill="#F4F1E9"/>

  <!-- High-visibility bold labels -->
  <text x="400" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#F4F1E9" letter-spacing="4">07:00 · DAY SHIFT</text>
  <text x="660" y="560" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#00E5FF" letter-spacing="3">15:00 · SWING</text>
  <text x="140" y="560" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#FF5500" letter-spacing="3">23:00 · NIGHT</text>

  <!-- Big Punchy Central Headline -->
  <text x="400" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#F4F1E9" letter-spacing="6">CONTINUOUS</text>
  <text x="400" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#00E5FF" letter-spacing="6">ROTATION</text>
  
  <!-- Bottom Monospace Tag -->
  <text x="400" y="730" text-anchor="middle" font-family="ui-monospace, monospace" font-weight="700" font-size="16" fill="#F4F1E9" letter-spacing="8" opacity="0.8">24-HOUR CREW COVERAGE · BRAMLABS</text>
</svg>
