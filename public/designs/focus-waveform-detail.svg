<svg xmlns="http://www.w3.org/2000/svg" viewBox="120 120 560 560" fill="none">
  <rect width="800" height="800" fill="#F4F1E9"/><rect x="120" y="120" width="560" height="560" fill="none" stroke="#111315" stroke-width="2" opacity="0.15"/>
  <line x1="80" y1="400" x2="720" y2="400" stroke="#111315" stroke-width="1" opacity="0.2"/>
  <line x1="80" y1="280" x2="720" y2="280" stroke="#111315" stroke-width="0.5" opacity="0.1"/>
  <line x1="80" y1="520" x2="720" y2="520" stroke="#111315" stroke-width="0.5" opacity="0.1"/>
  <!-- secondary echo -->
  <path d="M80 420 C 160 420, 200 360, 280 380 S 400 500, 480 360 S 640 300, 720 400" stroke="#7976E8" stroke-width="2" opacity="0.25" fill="none"/>
  <!-- primary wave -->
