  <line x1="520" y1="300" x2="520" y2="180" stroke="#7976E8" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="520" y="165" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#7976E8" letter-spacing="2">PEAK FOCUS</text>
  <text x="400" y="100" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#111315" letter-spacing="5">FOCUS IS A WAVEFORM</text>
  <text x="100" y="640" font-family="ui-monospace,monospace" font-size="12" fill="#666963" letter-spacing="2">T0</text>
  <text x="700" y="640" text-anchor="end" font-family="ui-monospace,monospace" font-size="12" fill="#666963" letter-spacing="2">TN</text>
  <text x="400" y="700" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#666963" letter-spacing="3">DEEP WORK · RISE · HOLD · DECAY</text>
