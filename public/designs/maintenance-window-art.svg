<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <!-- MAINTENANCE WINDOW / READ-ONLY MODE -->
  <!-- Outer Heavy Industrial Frame -->
  <rect x="60" y="60" width="680" height="680" rx="16" stroke="#F4F1E9" stroke-width="8" fill="#111315"/>

  <!-- Top Yellow/Black Hazard Stripes Bar -->
  <rect x="60" y="60" width="680" height="90" fill="#FFD600"/>
  <!-- Hazard Stripe slashes -->
  <path d="M 60 60 L 100 60 L 60 150 Z M 140 60 L 230 60 L 140 150 Z M 270 60 L 360 60 L 270 150 Z M 400 60 L 490 60 L 400 150 Z M 530 60 L 620 60 L 530 150 Z M 660 60 L 740 60 L 660 150 Z" fill="#111315"/>

  <!-- Main Headline Box -->
  <rect x="90" y="180" width="620" height="110" rx="12" fill="#F4F1E9"/>
  <text x="400" y="235" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" fill="#111315" letter-spacing="4">MAINTENANCE WINDOW</text>
  <text x="400" y="270" text-anchor="middle" font-family="ui-monospace, monospace" font-weight="800" font-size="18" fill="#FF5500" letter-spacing="4">SCHEDULED SYSTEM LOCKDOWN</text>

  <!-- Big Bold Status Box -->
  <rect x="90" y="320" width="620" height="160" rx="12" stroke="#FF5500" stroke-width="6" fill="#FF5500" fill-opacity="0.15"/>
  <text x="400" y="380" text-anchor="middle" font-family="ui-monospace, monospace" font-weight="900" font-size="22" fill="#00E5FF" letter-spacing="4">WINDOW: 02:00 — 04:00 UTC</text>
  <text x="400" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FF5500" letter-spacing="6">[ READ-ONLY MODE ]</text>

  <!-- Action buttons -->
  <g transform="translate(140, 510)">
    <rect x="0" y="0" width="240" height="60" rx="8" fill="#00E5FF"/>
    <text x="120" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#111315">ACKNOWLEDGED</text>
  </g>
  
  <g transform="translate(420, 510)">
    <rect x="0" y="0" width="240" height="60" rx="8" stroke="#F4F1E9" stroke-width="4" fill="none"/>
    <text x="120" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#F4F1E9">SNOOZE [15M]</text>
  </g>

  <!-- Bottom Tag -->
  <text x="400" y="705" text-anchor="middle" font-family="ui-monospace, monospace" font-weight="800" font-size="16" fill="#F4F1E9" opacity="0.8" letter-spacing="6">NO PROD WRITES · UTILITY ONLY · BRAMLABS</text>
</svg>
