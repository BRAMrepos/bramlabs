<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <!-- Radial Guidelines -->
  <line x1="400" y1="400" x2="760.0" y2="400.0" stroke="#1C1917" stroke-width="1.25" stroke-dasharray="4 6" opacity="0.3"/>
  <line x1="400" y1="400" x2="654.6" y2="654.6" stroke="#1C1917" stroke-width="1.25" stroke-dasharray="4 6" opacity="0.3"/>
  <line x1="400" y1="400" x2="400.0" y2="760.0" stroke="#1C1917" stroke-width="1.25" stroke-dasharray="4 6" opacity="0.3"/>
  <line x1="400" y1="400" x2="145.4" y2="654.6" stroke="#1C1917" stroke-width="1.25" stroke-dasharray="4 6" opacity="0.3"/>
  <line x1="400" y1="400" x2="40.0" y2="400.0" stroke="#1C1917" stroke-width="1.25" stroke-dasharray="4 6" opacity="0.3"/>
  <line x1="400" y1="400" x2="145.4" y2="145.4" stroke="#1C1917" stroke-width="1.25" stroke-dasharray="4 6" opacity="0.3"/>
  <line x1="400" y1="400" x2="400.0" y2="40.0" stroke="#1C1917" stroke-width="1.25" stroke-dasharray="4 6" opacity="0.3"/>
  <line x1="400" y1="400" x2="654.6" y2="145.4" stroke="#1C1917" stroke-width="1.25" stroke-dasharray="4 6" opacity="0.3"/>

  <!-- Three Interlocking Handoff Arcs -->
  <path d="M100 400 A300 300 0 1 1 700 400" stroke="#FF862E" stroke-width="36" stroke-linecap="round" fill="none"/>
  <path d="M150 440 A250 250 0 1 1 650 440" stroke="#42C991" stroke-width="36" stroke-linecap="round" fill="none"/>
  <path d="M200 480 A200 200 0 1 1 600 480" stroke="#1C1917" stroke-width="36" stroke-linecap="round" fill="none" opacity="0.45"/>

  <!-- Transfer Node Markers -->
  <circle cx="100" cy="400" r="16" fill="#FF862E"/>
  <circle cx="700" cy="400" r="16" fill="#FF862E"/>
  
  <circle cx="150" cy="440" r="14" fill="#42C991"/>
  <circle cx="650" cy="440" r="14" fill="#42C991"/>

  <!-- Center Target -->
  <circle cx="400" cy="360" r="30" fill="none" stroke="#1C1917" stroke-width="3.5"/>
  <circle cx="400" cy="360" r="10" fill="#1C1917"/>

  <!-- Node Labels -->
  <text x="60" y="395" text-anchor="end" font-family="ui-monospace,monospace" font-size="16" font-weight="800" fill="#FF862E">NODE 01 [IN]</text>
  <text x="740" y="395" font-family="ui-monospace,monospace" font-size="16" font-weight="800" fill="#FF862E">NODE 02 [OUT]</text>

  <!-- Typography -->
  <text x="400" y="65" text-anchor="middle" font-family="system-ui,sans-serif" font-size="44" font-weight="900" fill="#1C1917" letter-spacing="8">24H HAND-OFF</text>
  <text x="400" y="725" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" font-weight="800" fill="#1C1917" letter-spacing="5">DAY → SWING → NIGHT</text>
  <text x="400" y="760" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="700" fill="#1C1917" letter-spacing="3">UNINTERRUPTED CREW TRANSFER SYSTEM</text>
</svg>
