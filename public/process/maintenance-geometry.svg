<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <!-- Console Frame -->
  <rect x="30" y="40" width="740" height="720" rx="14" stroke="#1C1917" stroke-width="3.5" fill="none"/>
  <line x1="30" y1="120" x2="770" y2="120" stroke="#1C1917" stroke-width="2.5" opacity="0.5"/>

  <!-- Status LED -->
  <circle cx="730" cy="80" r="10" fill="#42C991"/>
  <text x="70" y="87" font-family="ui-monospace,monospace" font-size="18" font-weight="800" fill="#1C1917" letter-spacing="4">SYSTEM // MAINTENANCE WINDOW</text>

  <!-- Data Rows -->
  <text x="70" y="180" font-family="ui-monospace,monospace" font-size="14" font-weight="700" fill="#1C1917" letter-spacing="2">WINDOW</text>
  <text x="70" y="216" font-family="system-ui,sans-serif" font-size="34" font-weight="900" fill="#1C1917">02:00 – 04:00 UTC</text>
  <text x="730" y="216" text-anchor="end" font-family="ui-monospace,monospace" font-size="14" font-weight="800" fill="#42C991">SCHEDULED</text>
  <line x1="70" y1="236" x2="730" y2="236" stroke="#1C1917" stroke-width="1.5" opacity="0.2"/>
  <text x="70" y="272" font-family="ui-monospace,monospace" font-size="14" font-weight="700" fill="#1C1917" letter-spacing="2">IMPACT</text>
  <text x="70" y="308" font-family="system-ui,sans-serif" font-size="34" font-weight="900" fill="#1C1917">READ-ONLY MODE</text>
  <text x="730" y="308" text-anchor="end" font-family="ui-monospace,monospace" font-size="14" font-weight="800" fill="#42C991">ENFORCED</text>
  <line x1="70" y1="328" x2="730" y2="328" stroke="#1C1917" stroke-width="1.5" opacity="0.2"/>
  <text x="70" y="364" font-family="ui-monospace,monospace" font-size="14" font-weight="700" fill="#1C1917" letter-spacing="2">SCOPE</text>
  <text x="70" y="400" font-family="system-ui,sans-serif" font-size="34" font-weight="900" fill="#1C1917">API · EDGE · CACHE</text>
  <text x="730" y="400" text-anchor="end" font-family="ui-monospace,monospace" font-size="14" font-weight="800" fill="#42C991">3 CLUSTERS</text>
  <line x1="70" y1="420" x2="730" y2="420" stroke="#1C1917" stroke-width="1.5" opacity="0.2"/>
  <text x="70" y="456" font-family="ui-monospace,monospace" font-size="14" font-weight="700" fill="#1C1917" letter-spacing="2">OWNER</text>
  <text x="70" y="492" font-family="system-ui,sans-serif" font-size="34" font-weight="900" fill="#1C1917">ON-CALL ROTATION</text>
  <text x="730" y="492" text-anchor="end" font-family="ui-monospace,monospace" font-size="14" font-weight="800" fill="#42C991">CREW ALPHA</text>
  <line x1="70" y1="512" x2="730" y2="512" stroke="#1C1917" stroke-width="1.5" opacity="0.2"/>
  <text x="70" y="548" font-family="ui-monospace,monospace" font-size="14" font-weight="700" fill="#1C1917" letter-spacing="2">STATUS</text>
  <text x="70" y="584" font-family="system-ui,sans-serif" font-size="34" font-weight="900" fill="#1C1917">ACKNOWLEDGED</text>
  <text x="730" y="584" text-anchor="end" font-family="ui-monospace,monospace" font-size="14" font-weight="800" fill="#42C991">READY</text>
  <line x1="70" y1="604" x2="730" y2="604" stroke="#1C1917" stroke-width="1.5" opacity="0.2"/>

  <!-- Action Buttons -->
  <rect x="70" y="670" width="180" height="52" rx="8" fill="#1C1917"/>
  <text x="160" y="703" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" font-weight="900" fill="#111315" letter-spacing="2">ACK</text>

  <rect x="270" y="670" width="180" height="52" rx="8" stroke="#1C1917" stroke-width="2.5" fill="none"/>
  <text x="360" y="703" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" font-weight="900" fill="#1C1917" letter-spacing="2">SNOOZE</text>
</svg>
