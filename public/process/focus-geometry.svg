<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <!-- Axes -->
  <line x1="30" y1="400" x2="770" y2="400" stroke="#F4F1E9" stroke-width="3" opacity="0.4"/>
  <line x1="30" y1="200" x2="770" y2="200" stroke="#F4F1E9" stroke-width="1" stroke-dasharray="6 6" opacity="0.25"/>
  <line x1="30" y1="600" x2="770" y2="600" stroke="#F4F1E9" stroke-width="1" stroke-dasharray="6 6" opacity="0.25"/>

  <!-- Echo Wave -->
  <path d="M30 430 C 150 430, 210 300, 310 340 S 450 580, 550 320 S 690 190, 770 430" stroke="#8B88FF" stroke-width="3.5" fill="none" opacity="0.35"/>

  <!-- Bold Primary Wave -->
  <path d="M30 400 C 150 400, 210 100, 330 180 S 470 700, 570 200 S 690 60, 770 400" stroke="#8B88FF" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- Peak Focus Indicator -->
  <circle cx="570" cy="200" r="14" fill="#8B88FF"/>
  <line x1="570" y1="200" x2="570" y2="80" stroke="#8B88FF" stroke-width="2.5" stroke-dasharray="4 4"/>
  <rect x="470" y="45" width="200" height="36" rx="6" fill="rgba(139, 136, 255, 0.35)" stroke="#8B88FF" stroke-width="2"/>
  <text x="570" y="68" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" font-weight="800" fill="#F4F1E9">PEAK FOCUS // 440Hz</text>

  <!-- Typography -->
  <text x="400" y="760" text-anchor="middle" font-family="system-ui,sans-serif" font-size="40" font-weight="900" fill="#F4F1E9" letter-spacing="4">FOCUS IS A WAVEFORM</text>
  <text x="50" y="710" font-family="ui-monospace,monospace" font-size="14" font-weight="700" fill="rgba(244, 241, 233, 0.85)">T0: START</text>
  <text x="400" y="710" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" font-weight="800" fill="#8B88FF">DEEP WORK RESONANCE</text>
  <text x="750" y="710" text-anchor="end" font-family="ui-monospace,monospace" font-size="14" font-weight="700" fill="rgba(244, 241, 233, 0.85)">TN: DECAY</text>
</svg>
